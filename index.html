<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1c2430;--mut:#667085;--line:#e3e7ee;--pri:#2C3C63;--pri2:#e9edf5;--gold:#C9AA6F;--navy-d:#1f2b4a;--ok:#1b7f4b;--okbg:#e6f5ec;--warn:#b25e00;--warnbg:#fff3e0;--err:#b42318;--errbg:#fdeceb}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--pri);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:4px solid var(--gold)}
header img{width:46px;height:46px;border-radius:8px;display:block}
header .marca{display:flex;flex-direction:column;line-height:1.2}
header .marca small{color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-size:11px;font-weight:600}
header h1{font-size:16px;margin:0;font-weight:600}
header .emp{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:13px}
header select{padding:5px 8px;border-radius:6px;border:0;max-width:340px}
nav{display:flex;gap:4px;padding:10px 20px 0;background:var(--bg);border-bottom:1px solid var(--line);flex-wrap:wrap}
nav button{border:0;background:transparent;padding:9px 14px;border-radius:8px 8px 0 0;cursor:pointer;font-size:14px;color:var(--mut)}
nav button.on{background:var(--card);color:var(--pri);font-weight:600;border:1px solid var(--line);border-bottom:1px solid var(--card);margin-bottom:-1px;box-shadow:inset 0 3px 0 var(--gold)}
main{padding:18px 20px 60px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 10px}
.card h3{font-size:14px;margin:14px 0 6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input[type=text],input[type=number],input[type=password],select,input:not([type]){padding:7px 9px;border:1px solid #cdd3dd;border-radius:6px;font:inherit;background:#fff}
input[type=file]{font:inherit}
input.bad{border-color:var(--err);background:var(--errbg)}
button.b{border:1px solid #cdd3dd;background:#fff;padding:7px 12px;border-radius:7px;cursor:pointer;font:inherit}
button.b:hover{background:#f0f3f8}
button.p{background:var(--pri);color:#fff;border-color:var(--pri)}
button.p:hover{background:var(--navy-d)}
button.d{color:var(--err);border-color:#f0c3bf}
button:disabled{opacity:.45;cursor:not-allowed}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#f0f3f8;font-weight:600;position:sticky;top:0;z-index:1}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:8px}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-err{background:var(--errbg);color:var(--err)}.b-gray{background:#eceff4;color:var(--mut)}
.msg{padding:9px 12px;border-radius:8px;margin:8px 0;font-size:13px}
.m-ok{background:var(--okbg);color:var(--ok)}.m-warn{background:var(--warnbg);color:var(--warn)}.m-err{background:var(--errbg);color:var(--err)}.m-info{background:var(--pri2);color:var(--pri)}
.muted{color:var(--mut)}.small{font-size:12px}
.issue{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:10px 12px;margin:8px 0;background:#fffdf8}
.issue.ok{border-left-color:var(--ok);background:#f7fcf9}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0}
.kpi{background:#f0f3f8;border-radius:8px;padding:8px 10px;border-left:3px solid var(--gold)}.kpi b{display:block;font-size:17px}
.chip{display:inline-block;border:1px solid #cdd3dd;border-radius:14px;padding:3px 10px;margin:2px 4px 2px 0;cursor:pointer;background:#fff;font-size:12.5px}
.chip:hover{background:var(--pri2);border-color:var(--pri)}
.modal{position:fixed;inset:0;background:rgba(20,28,45,.5);display:flex;align-items:center;justify-content:center;z-index:99}.modal .box{background:#fff;border-radius:10px;padding:18px 20px;max-width:480px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.tree details{border:1px solid var(--line);border-radius:8px;margin:6px 0;background:#fff}
.tree summary{padding:9px 12px;cursor:pointer;font-weight:600}
.tree .mes{display:flex;gap:12px;align-items:center;padding:7px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
#toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:50}
#toast div{padding:10px 14px;border-radius:8px;color:#fff;background:var(--pri);border-left:4px solid var(--gold);box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:440px}
#toast div.err{background:var(--err)}
code{background:#eef1f6;padding:1px 5px;border-radius:4px}
</style>
</head>

async function doSave(){

      m.put(DB.activa,'activa');m.put(DB.plantilla,'plantilla');m.put(DB.ssco,'ssco');
      for(const r of Object.keys(DB.empresas)){const {periodos,bases,...rest}=DB.empresas[r];es.put(rest,r);}
      for(const r of de){es.delete(r);ps.delete(IDBKeyRange.bound(r+'|',r+'|\uffff'));bs.delete(IDBKeyRange.bound(r+'|',r+'|\uffff'));}
      for(const k of db){const [r,a,mm]=k.split('|');const e=DB.empresas[r];const x=e&&e.bases&&e.bases[a]&&e.bases[a][mm];if(x)bs.put(x,k);else bs.delete(k);}

async function leerXlsx(file){
  const zip=await JSZip.loadAsync(await file.arrayBuffer());
  const parse=async p=>{const f=zip.file(p);return f?new DOMParser().parseFromString(await f.async('string'),'application/xml'):null;};
  const ss=[];const ssd=await parse('xl/sharedStrings.xml');
  if(ssd)for(const si of ssd.getElementsByTagName('si')){let t='';for(const x of si.getElementsByTagName('t'))t+=x.textContent;ss.push(t);}
  let path='xl/worksheets/sheet1.xml';
  const wb=await parse('xl/workbook.xml'),rels=await parse('xl/_rels/workbook.xml.rels');
  if(wb&&rels){const sh=wb.getElementsByTagName('sheet')[0];const rid=sh&&sh.getAttribute('r:id');
    for(const r of rels.getElementsByTagName('Relationship'))if(r.getAttribute('Id')===rid){const t=r.getAttribute('Target');path=t.startsWith('/')?t.slice(1):'xl/'+t;}}
  const doc=await parse(path);if(!doc)throw new Error('No se pudo leer la hoja del Excel: '+file.name);
  const rows=[];
  for(const row of doc.getElementsByTagName('row')){
    const r=parseInt(row.getAttribute('r'))-1;const arr=[];
    for(const c of row.getElementsByTagName('c')){
      const ci=colIdx(c.getAttribute('r'));const t=c.getAttribute('t');const ve=c.getElementsByTagName('v')[0];let v=null;
      if(t==='s')v=ve?ss[+ve.textContent]:null;
      else if(t==='inlineStr')v=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');
      else if(t==='str'||t==='e')v=ve?ve.textContent:null;
      else if(t==='b')v=!!(ve&&ve.textContent==='1');
      else if(ve&&ve.textContent!=='')v=parseFloat(ve.textContent);
      arr[ci]=v;}
    rows[r]=arr;}
  return rows;
}
const cellStr=v=>v==null?'':String(v).trim();
function findHeader(rows,names){ // fila que contiene todos los nombres
  for(let i=0;i<Math.min(rows.length,60);i++){const r=rows[i];if(!r)continue;const set=r.map(v=>cellStr(v).toUpperCase());
    if(names.every(n=>set.includes(n.toUpperCase()))){const map={};names.forEach(n=>map[n]=set.indexOf(n.toUpperCase()));return {i,map,set};}}
  return null;
}
function parsePlan(rows){
  const h=findHeader(rows,['CUENTA','DESCRIPCION']);if(!h)throw new Error('El plan de cuentas no tiene las columnas CUENTA y DESCRIPCION.');
  const cC=h.map['CUENTA'],cD=h.map['DESCRIPCION'],cDeb=h.set.indexOf('A.DEBE'),cHab=h.set.indexOf('A.HABER'),cTipo=h.set.indexOf('TIPO');
  const out=[];
  for(let i=h.i+1;i<rows.length;i++){const r=rows[i];if(!r)continue;let code='';
    for(let c=cC;c<cD;c++){if(cellStr(r[c])){code=cellStr(r[c]);break;}}
    if(!code||!/^[0-9A-Za-z]+$/.test(code))continue;
    out.push([code,cellStr(r[cD]).slice(0,110),cDeb>=0?cellStr(r[cDeb]):'',cHab>=0?cellStr(r[cHab]):'',cTipo>=0?cellStr(r[cTipo]):'']);}
  return out;
}
function parseRegistro(rows){
  const h=findHeader(rows,['F.EMIS.','R.U.C.','NUMERO','TOTAL']);if(!h)throw new Error('El registro de compras no tiene las columnas esperadas (F.EMIS., R.U.C., NUMERO, Total).');

  for(let i=h.i+1;i<rows.length;i++){const r=rows[i];if(!r)continue;const ruc=cellStr(r[m['R.U.C.']]);const fe=toDate(r[m['F.EMIS.']]);

}
function parseDiario(rows){
  const h=findHeader(rows,['FECHA','CUENTA','DEBE','HABER']);if(!h)throw new Error('El libro diario no tiene las columnas FECHA, CUENTA, DEBE y HABER.');
  const m=h.map;const asi=[];let cur=null;
  for(let i=h.i+1;i<rows.length;i++){const r=rows[i];if(!r)continue;
    const txt=r.map(cellStr).find(s=>/sub\s*diario\s*\S+\s*asiento/i.test(s));
    if(txt){const mm=/sub\s*diario\s*(\S+)\s*asiento\s*n[oº°.]*\s*:?\s*(\d+)/i.exec(txt);cur={sub:mm?mm[1]:'?',n:mm?+mm[2]:0,lines:[]};asi.push(cur);continue;}
    const cta=cellStr(r[m['CUENTA']]);if(!cta||!cur)continue;
    cur.lines.push({cta,fecha:toDate(r[m['FECHA']]),debe:Number(r[m['DEBE']])||0,haber:Number(r[m['HABER']])||0});}
  asi.forEach(a=>{a.fecha=(a.lines[0]&&a.lines[0].fecha)||null;
    const l=a.lines.find(l=>/^4[26]/.test(l.cta));a.tot=l?Math.round(Math.abs(l.debe-l.haber)*100):null;});
  return asi.filter(a=>a.lines.length);
}
function cuentaGasto(a){
  let best=null,bv=0;
  for(const l of a.lines){if(/^(40|42|46|45|44|10|12|79|9)/.test(l.cta))continue;const v=Math.abs(l.debe-l.haber);if(v>bv){bv=v;best=l.cta;}}
  return best;
}
function cruzar(reg,asi){
  if(reg.some(r=>r.cuo)&&asi.some(a=>a.cuo)){
    const m=new Map(asi.map(a=>[a.cuo,a]));const pairs=[];
    for(const r of reg){const a=r.cuo&&m.get(r.cuo);if(a&&!a.used){a.used=true;pairs.push([r,a]);}}
    if(pairs.length)return {sub:'CUO',pairs,total:asi.length};
  }
  const bySub={};asi.forEach(a=>(bySub[a.sub]=bySub[a.sub]||[]).push(a));
  let best=null;
  for(const [sub,list] of Object.entries(bySub)){
    list.forEach(a=>a.used=false);const pairs=[];const used=new Set();
    const rc=r=>Math.round(Math.abs(r.total)*100);
    reg.forEach((r,ri)=>{const a=list.find(a=>!a.used&&a.tot===rc(r)&&a.fecha&&iso(a.fecha)===iso(r.fe));if(a){a.used=true;used.add(ri);pairs.push([r,a]);}});
    reg.forEach((r,ri)=>{if(used.has(ri))return;const a=list.find(a=>!a.used&&a.tot===rc(r));if(a){a.used=true;used.add(ri);pairs.push([r,a]);}});
    if(!best||pairs.length>best.pairs.length)best={sub,pairs,total:list.length};
  }
  return best;
}
function importarHistorico(e,plan,reg,asi){
  const rep=[];
  if(plan){e.plan=plan;rep.push(`Plan de cuentas: ${plan.length} cuentas cargadas.`);}
  if(reg&&asi){
    const best=cruzar(reg,asi);
    if(!best||!best.pairs.length)throw new Error('No pude cruzar ningún comprobante del registro con asientos del libro diario (revisa que ambos archivos sean de la misma empresa y período).');
    const hist={},nom={};
    for(const [r,a] of best.pairs){const cta=cuentaGasto(a);if(!cta)continue;(hist[r.ruc]=hist[r.ruc]||{});hist[r.ruc][cta]=(hist[r.ruc][cta]||0)+1;nom[r.ruc]=r.rs;}
    let mix=0,nuevos=0;
    for(const ruc of Object.keys(hist)){
      const h=hist[ruc];const ctas=Object.keys(h).sort((x,y)=>h[y]-h[x]);let r=e.reglas[ruc];
      if(!r){r=e.reglas[ruc]={nombre:nom[ruc],cuenta:ctas[0],estado:'unica',hist:h};nuevos++;}
      else{r.hist=h;r.nombre=nom[ruc]||r.nombre;}
      if(r.estado!=='confirmada'){r.estado=ctas.length===1?'unica':'mixta';r.cuenta=ctas[0];}
      if(r.estado==='mixta')mix++;}
    rep.push(`${best.sub==='CUO'?'Libro diario: cruce exacto por código único de operación (CUO).':'Libro diario: subdiario de compras detectado = '+best.sub+'.'} Cruzados ${best.pairs.length} de ${reg.length} comprobantes del registro.`);
    rep.push(`Proveedores con regla: ${Object.keys(hist).length} (nuevos: ${nuevos}); con historial mixto (se te consultará al procesar): ${mix}.`);
    if(best.pairs.length<reg.length)rep.push(`Atención: ${reg.length-best.pairs.length} comprobantes del registro no encontraron asiento; no aportan reglas.`);
  }
  return rep;
}

async function leerTextoSire(file){

}
function parseSire(text){

  for(const n of need)if(!head.includes(n))throw new Error('El TXT no parece una propuesta RCE del SIRE (falta la columna "'+n+'").');

  return out;
}

/* Nombre oficial: LE + RUC(11) + AAAA + MM + 00 + libro(6) + oportunidad(2) + indicadores(4) */
function detectarArchivo(name){
  const m=/(?:^|[^A-Za-z0-9])LE(\d{11})(\d{4})(\d{2})00(\d{6})(\d{2})(\d)(\d)(\d)(\d)\.txt$/i.exec(String(name||'').split(/[\\/]/).pop());
  if(!m)return null;
  const lib=LIBROS[m[4]];
  return {ruc:m[1],anio:+m[2],mes:+m[3],libro:m[4],oport:m[5],sinOps:m[6]==='0',gen:m[9],tipo:lib?lib.t:'desconocido',formato:lib?lib.f:'',nombre:lib?lib.n:'Libro '+m[4]};
}
function tipoTxt(det,text){
  if(det&&det.tipo!=='desconocido')return det.tipo==='compras'?(det.formato==='SIRE'?'compras-sire':'compras-ple'):det.tipo==='ventas'?'ventas-'+det.formato.toLowerCase():det.tipo==='diario'?'diario-ple':det.tipo;
  const l=(text.split(/\r?\n/).find(x=>x.trim())||'');const c=l.split('|');
  if(/^RUC\|/i.test(l)&&/car sunat/i.test(l))return 'compras-sire';
  if(/^\d{8,11}$/.test(c[0])&&c.length>=40&&/^\d{6}$/.test(c[2]||''))return 'compras-sire';
  if(/^\d{8}$/.test(c[0])&&c.length>=40)return 'compras-ple';
  if(/^\d{8}$/.test(c[0])&&c.length>=20&&c.length<=30)return 'diario-ple';
  return 'desconocido';
}

      'fecha de emisión':c[3],'fecha vcto/pago':c[4],'tipo cp/doc.':c[5],'serie del cdp':c[6],'nro cp o doc. nro inicial (rango)':c[8],

    return o;});
}
/* ----- PLE 5.1 (Libro Diario): agrupa por código único de operación (CUO) ----- */
function parsePle51(text){

  lines.forEach((l,ix)=>{

    const cuo=c[1];let a=map.get(cuo);
    if(!a){a={cuo,sub:cuo.split('.').slice(0,2).join('.'),n:asi.length+1,per:c[0].slice(0,6),lines:[]};map.set(cuo,a);asi.push(a);}
    a.lines.push({cta:c[3],fecha:parseDMY(c[12]),debe:parseFloat(c[17])||0,haber:parseFloat(c[18])||0,glosa:c[15]});

/* ================= comprobantes electrónicos: XML (UBL 2.1) y PDF ================= */
let XML={items:[],pdfs:[],errores:[],leidos:0,res:null};
const kid=(el,n)=>{if(!el)return null;for(const c of el.children)if(c.localName===n)return c;return null;};

  const m=/encoding=["']([^"']+)["']/i.exec(head);let enc=((m&&m[1])||'utf-8').toLowerCase();

function parteCpe(p){

    razon:tx(walk(p,'PartyLegalEntity','RegistrationName'))||tx(walk(p,'PartyName','Name'))};
}
function parseCpeXml(text,fname){
  const doc=new DOMParser().parseFromString(text.replace(/^﻿/,''),'application/xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error('XML mal formado');
  const root=doc.documentElement,rn=root.localName;
  if(!['Invoice','CreditNote','DebitNote'].includes(rn))throw new Error(`no es un comprobante UBL (raíz "${rn}")`);
  const id=tx(kid(root,'ID')),pi=id.split('-');if(pi.length<2)throw new Error('no encuentro serie-número (cbc:ID)');
  const serie=pi[0].trim(),nro=pi.slice(1).join('-').trim();

  const x={fname,rn,tipo,serie,nro,fecha:tx(kid(root,'IssueDate')),moneda:tx(kid(root,'DocumentCurrencyCode'))||'PEN',
    emisor:parteCpe(walk(root,'AccountingSupplierParty','Party')),rec:parteCpe(walk(root,'AccountingCustomerParty','Party')),
    pago:{tipo:'Contado',cuotas:[]},detr:null,guia:tx(walk(root,'DespatchDocumentReference','ID')),
    ref:tx(walk(root,'BillingReference','InvoiceDocumentReference','ID')),items:[]};
  for(const pt of kids(root,'PaymentTerms')){
    const pid=tx(kid(pt,'ID')),mean=tx(kid(pt,'PaymentMeansID'));

    if(/^Cuota/i.test(mean)||/^Cuota/i.test(pid))x.pago.cuotas.push({monto:toC(tx(kid(pt,'Amount'))),fecha:tx(kid(pt,'PaymentDueDate'))});
    if(/^Detraccion$/i.test(pid))x.detr={cod:mean,pct:tx(kid(pt,'PaymentPercent')),monto:toC(tx(kid(pt,'Amount')))};
  }
  const t={};
  for(const tt of kids(root,'TaxTotal'))for(const st of kids(tt,'TaxSubtotal')){const sc=tx(walk(st,'TaxCategory','TaxScheme','ID'));
    t[sc]=t[sc]||{base:0,imp:0};t[sc].base+=toC(tx(kid(st,'TaxableAmount')));t[sc].imp+=toC(tx(kid(st,'TaxAmount')));}
  const lm=kid(root,'LegalMonetaryTotal');

  const lineN=rn==='Invoice'?'InvoiceLine':rn==='CreditNote'?'CreditNoteLine':'DebitNoteLine';
  for(const ln of kids(root,lineN)){const q=kid(ln,'InvoicedQuantity')||kid(ln,'CreditedQuantity')||kid(ln,'DebitedQuantity');
    x.items.push({desc:tx(walk(ln,'Item','Description')).replace(/\s+/g,' '),cant:tx(q),und:q?q.getAttribute('unitCode')||'':''});}

  return x;

async function expandirArchivos(files,errores){
  const out=[];
  for(const f of files){
    if(/\.zip$/i.test(f.name)){
      try{const z=await JSZip.loadAsync(await f.arrayBuffer());
        for(const en of Object.values(z.files)){if(en.dir)continue;const nm=en.name.split('/').pop();
          if(/\.xml$/i.test(nm))out.push({name:nm,buf:await en.async('arraybuffer'),t:'xml'});else if(/\.pdf$/i.test(nm))out.push({name:nm,t:'pdf'});}}
      catch(err){errores.push(`${f.name}: no pude abrir el ZIP (${err.message})`);}
    }else if(/\.xml$/i.test(f.name))out.push({name:f.name,buf:await f.arrayBuffer(),t:'xml'});
    else if(/\.pdf$/i.test(f.name))out.push({name:f.name,t:'pdf'});
    else errores.push(`${f.name}: tipo de archivo no soportado (usa .xml, .zip o .pdf)`);
  }
  return out;
}
async function procesarComprobantes(files){
  const e=emp();

  for(const f of fl){
    if(f.t==='pdf'){if(!XML.pdfs.some(p=>p.name===f.name))XML.pdfs.push({name:f.name});continue;}
    try{const x=parseCpeXml(decodeXml(f.buf),f.name);XML.leidos++;
      if(XML.items.some(y=>y.emisor.ruc===x.emisor.ruc&&y.serie===x.serie&&nroN(y.nro)===nroN(x.nro))){(XML.dups=XML.dups||[]).push(`${f.name}: ${x.serie}-${x.nro} ya estaba cargado; se fusionó en un solo comprobante.`);const y0=XML.items.find(y=>y.emisor.ruc===x.emisor.ruc&&y.serie===x.serie&&nroN(y.nro)===nroN(x.nro));for(const k of Object.keys(x))if(vacio(y0[k])&&!vacio(x[k]))y0[k]=x[k];continue;}
      XML.items.push(x);}
    catch(err){XML.errores.push(`${f.name}: ${err.message}`);}
  }

}
const pdfCoincide=(p,x)=>{const n=p.name.toUpperCase().replace(/[^A-Z0-9]/g,'');const s=x.serie.toUpperCase(),r=x.emisor.ruc;

/* Valida el receptor y cruza por RUC emisor + serie + número con el registro cargado */
function aplicarXml(){
  const e=emp();if(!e)return;
  const idx={};
  if(P)for(const c of P.comps){c.xml=null;c.xmlAl=[];c.condicion=null;idx[[c.ruc,c.serie.toUpperCase(),nroN(c.nro)].join('|')]=c;}

    if(!c){x.estado=P?'sinReg':'valido';if(P)res.sinReg.push(x);continue;}
    x.estado='cruzado';res.cruz++;c.xml=x;
    c.condicion=x.pago.tipo==='Credito'?'CRE':'CON';

    if(xv.igv!==o.igv)c.xmlAl.push(`IGV del XML S/ ${fmt(xv.igv)} ≠ IGV del registro S/ ${fmt(o.igv)}`);
    if(xv.bi!==o.bi)c.xmlAl.push(`Base del XML S/ ${fmt(xv.bi)} ≠ base del registro S/ ${fmt(o.bi)}`);
    if((x.moneda==='PEN')!==(c.moneda==='PEN'))c.xmlAl.push(`Moneda del XML (${x.moneda}) distinta a la del registro (${c.moneda})`);
    if(c.xmlAl.length)res.difs++;

/* ================= validaciones ================= */
const RATES=[1800,1050];
function pairOk(b,i){
  if(b===0&&i===0)return {ok:true,tasa:null};
  if(b===0)return {ok:false,tasa:null};
  const s=Math.sign(b);
  for(const r of RATES)if(rnd(Math.abs(b)*r/10000)*s===i)return {ok:true,tasa:r/100};
  return {ok:false,tasa:null};
}
function sumaC(v){return v.bi+v.igv+v.bi2+v.igv2+v.bi3+v.igv3+v.ng+v.isc+v.icb+v.otros;}
function validar(c){
  const v=c.v;const p1=pairOk(v.bi,v.igv),p2=pairOk(v.bi2,v.igv2),p3=pairOk(v.bi3,v.igv3);
  const suma=sumaC(v),dif=v.total-suma;
  const tasaOk=p1.ok&&p2.ok&&p3.ok;
  return {ok:tasaOk&&dif===0,tasaOk,cuadreOk:dif===0,dif,suma,tasa:p1.tasa||p2.tasa||p3.tasa||null,
    rotoTasa:[!p1.ok&&'gravadas (DG)',!p2.ok&&'DGNG',!p3.ok&&'DNG'].filter(Boolean)};
}
function proponer(c){
  const s=c.v.total<0?-1:1;const w={};for(const k of Object.keys(c.v))w[k]=c.v[k]*s;
  const notas=[];
  if(!pairOk(w.bi,w.igv).ok){
    let best=null;
    if(w.igv===0)best={r:0,b:0};
    else for(const r of RATES){const b=Math.round(w.igv*10000/r);   // base que corresponde al IGV con esa tasa
      if(b>0&&rnd(b*r/10000)===w.igv){const d=Math.abs(b-w.bi);if(!best||d<best.d)best={r,b,d};}}
    if(!best)return {v:null,notas:['El IGV no corresponde exactamente a ninguna base con 18 % ni 10.5 %; no hay propuesta automática. Edítalo manualmente.']};
    const delta=w.bi-best.b;
    notas.push(`Base imponible ${fmt(w.bi*s)} → ${fmt(best.b*s)}${best.r?` (IGV ${best.r/100} %)`:' (sin IGV: se trata como no gravado)'}.`);
    w.bi=best.b;
    if(delta>0){w.ng+=delta;notas.push(`Diferencia de ${fmt(delta*s)} pasa a Valor de adquisiciones no gravadas (el total no cambia).`);}
    else{let need=-delta;const t1=Math.min(need,w.ng);w.ng-=t1;need-=t1;const t2=Math.min(need,w.otros);w.otros-=t2;need-=t2;
      if(t1)notas.push(`Se descuentan ${fmt(t1*s)} del no gravado.`);if(t2)notas.push(`Se descuentan ${fmt(t2*s)} de otros tributos y cargos.`);
      if(need>0){w.total+=need;notas.push(`El total aumenta ${fmt(need*s)}.`);}}
  }
  const dif=w.total-sumaC(w);
  if(dif>0){w.otros+=dif;notas.push(`Cuadre: ${fmt(dif*s)} se suma a Otros tributos y cargos.`);}
  else if(dif<0){if(w.otros+dif>=0){w.otros+=dif;notas.push(`Cuadre: ${fmt(dif*s)} se resta de Otros tributos y cargos.`);}
    else{w.total=sumaC(w);notas.push(`Cuadre: el total se ajusta a la suma de los conceptos (${fmt(w.total*s)}).`);}}
  const out={};for(const k of Object.keys(w))out[k]=w[k]*s;
  return {v:out,notas};
}

/* ================= v5: cargas independientes, múltiples y acumulativas (con fusión de duplicados) ================= */
const MODULOS={compras:'Registro de Compras',diario:'Libro Diario',ventas:'Registro de Ventas'};
const vacio=v=>v===undefined||v===null||v==='';
function baseDe(e,a,m,crear){

/* ----- fusión: une por clave; conserva el registro más completo y rellena lo que falte con el otro ----- */
function acumular(exist,entrantes,keyFn,fuse){
  const map=new Map();const st={nuevos:0,dup:0,fus:0,conf:0,leidos:entrantes.length};
  for(const x of exist){const k=keyFn(x);map.set(k,map.has(k)?fuse(map.get(k),x).r:x);}
  for(const x of entrantes){const k=keyFn(x);
    if(!map.has(k)){map.set(k,x);st.nuevos++;continue;}
    const f=fuse(map.get(k),x);map.set(k,f.r);if(f.conf)st.conf++;if(f.cambio)st.fus++;else st.dup++;}
  return {lista:[...map.values()],st};
}
const igualObj=(a,b)=>{const ks=new Set([...Object.keys(a),...Object.keys(b)]);for(const k of ks)if(String(a[k]==null?'':a[k])!==String(b[k]==null?'':b[k]))return false;return true;};
const nCampos=o=>Object.values(o).filter(v=>!vacio(v)).length;
function fuseFila(claves){return (old,nw)=>{
  const [base,otro]=nCampos(nw)>=nCampos(old)?[nw,old]:[old,nw];   // el más completo manda; en empate, el más reciente
  const out=Object.assign({},base);
  for(const k of Object.keys(otro))if(vacio(out[k])&&!vacio(otro[k]))out[k]=otro[k];
  const conf=claves.some(k=>!vacio(old[k])&&!vacio(nw[k])&&String(old[k])!==String(nw[k]));
  return {r:out,cambio:!igualObj(out,old),conf};};}
const fuseCompra=fuseFila(['total cp','igv / ipm dg','bi gravado dg']);
const fuseVenta=fuseFila(['total','igv','bi']);
const keyCompra=o=>[pad(G(o,'tipo cp/doc.'),2),G(o,'serie del cdp').toUpperCase(),nroN(G(o,'nro cp o doc. nro inicial (rango)')),G(o,'nro doc identidad')].join('|');
const keyVenta=o=>[pad(o.tipo||'',2),String(o.serie||'').toUpperCase(),nroN(o.nro),o.ruc||''].join('|');
const keyAsi=a=>a.cuo||('X|'+a.sub+'|'+a.n);
const keyPlan=x=>x[0];
function fusePlan(old,nw){const out=old.slice();let cambio=false;for(let i=1;i<nw.length;i++)if(!vacio(nw[i])&&nw[i]!==out[i]){out[i]=nw[i];cambio=true;}return {r:out,cambio,conf:false};}
const lkeys=lines=>{const c={};return lines.map(l=>{const b=[l.cta,(+l.debe||0).toFixed(2),(+l.haber||0).toFixed(2)].join('|');c[b]=(c[b]||0)+1;return b+'#'+c[b];});};
function fuseAsi(old,nw){
  const out=JSON.parse(JSON.stringify(old));const ko=lkeys(out.lines),kn=lkeys(nw.lines);const idx=new Map(ko.map((k,i)=>[k,i]));let cambio=false;
  nw.lines.forEach((l,j)=>{const k=kn[j];
    if(idx.has(k)){const t=out.lines[idx.get(k)];if(vacio(t.glosa)&&!vacio(l.glosa)){t.glosa=l.glosa;cambio=true;}if(vacio(t.fecha)&&!vacio(l.fecha)){t.fecha=l.fecha;cambio=true;}}
    else{out.lines.push(l);idx.set(k,out.lines.length-1);cambio=true;}});
  for(const k of ['sub','per','fecha','tot','cuo'])if(vacio(out[k])&&!vacio(nw[k])){out[k]=nw[k];cambio=true;}
  return {r:out,cambio,conf:false};
}
const serAsi=a=>({cuo:a.cuo||'',sub:a.sub||'',n:a.n||0,per:a.per||'',fecha:a.fecha?iso(a.fecha):'',tot:a.tot==null?'':a.tot,
  lines:a.lines.map(l=>({cta:l.cta,fecha:l.fecha?iso(l.fecha):'',debe:l.debe,haber:l.haber,glosa:l.glosa||''}))});
const hidAsi=s=>({cuo:s.cuo||'',sub:s.sub,n:s.n,per:s.per,fecha:s.fecha?fromIso(s.fecha):null,tot:s.tot===''?null:s.tot,used:false,

/* ----- carga de N archivos de un módulo: cada uno se guarda de inmediato en su empresa y período ----- */
async function cargarMulti(tipo,files,modo,aSel,mSel){
  const e=emp();const rep=[];const tocados=new Set();const reset=new Set();
  for(const f of files){
    try{
      const r=tipo==='compras'?await leerComprasArchivo(f,e,aSel,mSel):tipo==='diario'?await leerDiarioArchivo(f,e,aSel,mSel):await leerVentasArchivo(f,e);
      let items=tipo==='diario'?r.asi.map(serAsi):r.rows;let omit=0;
      if(!items.length)throw new Error('no tiene registros.');
      if(!(r.anio>=2000&&r.anio<=2100&&r.mes>=1&&r.mes<=12))throw new Error('no pude determinar el período; indica Ejercicio y Mes.');
      if(r.adq&&r.adq!==e.ruc&&!(await ask(`${f.name}\n\nEl RUC del archivo (${r.adq}) no coincide con el de la empresa activa (${e.ruc} · ${e.nombre}).\n\nSi continúas podrías mezclar datos de otra empresa.`,'Continuar de todos modos'))){rep.push(`✖ ${f.name}: omitido (RUC distinto al de la empresa).`);continue;}
      const b=baseDe(e,r.anio,r.mes,true);const k=r.anio+'|'+r.mes;
      if(tipo==='compras'){const ds=b.descartes||{},pd=b.provDesc||{};const n0=items.length;items=items.filter(o=>!ds[keyCompra(o)]&&!pd[G(o,'nro doc identidad')]);omit=n0-items.length;}
      if(modo==='reemplazar'&&!reset.has(tipo+k)){
        if(b[tipo].length&&!(await ask(`Se reemplazará lo guardado de ${MODULOS[tipo]} en ${mesLabel(r.anio,r.mes)} (${b[tipo].length} registros) por el contenido de ${f.name}.`,'Reemplazar'))){rep.push(`✖ ${f.name}: omitido (no se confirmó el reemplazo).`);continue;}
        reset.add(tipo+k);b[tipo]=[];
      }
      const x=acumular(b[tipo],items,tipo==='compras'?keyCompra:tipo==='diario'?keyAsi:keyVenta,tipo==='compras'?fuseCompra:tipo==='diario'?fuseAsi:fuseVenta);
      b[tipo]=x.lista;b.log.unshift(Object.assign({f:new Date().toISOString(),tipo,archivo:f.name,fuente:r.fuente},x.st));b.log=b.log.slice(0,40);
      marcaBase(e,r.anio,r.mes);tocados.add(k);
      rep.push(`✔ ${f.name} → ${mesLabel(r.anio,r.mes)} · ${r.fuente}: ${x.st.leidos} leídos · ${x.st.nuevos} nuevos · ${x.st.fus} fusionados (se completaron datos) · ${x.st.dup} duplicados idénticos descartados${omit?` · ${omit} omitidos porque los eliminaste antes de este período`:''}${x.st.conf?` · ⚠ ${x.st.conf} con importes distintos (se conservó el registro más completo; si empataban, el último cargado)`:''}. Guardados en ese período: ${b[tipo].length}.`);
    }catch(err){console.error(err);rep.push(`✖ ${f.name}: ${err.message}`);}
  }
  return {rep,tocados:[...tocados].map(s=>s.split('|').map(Number)).sort((a,b)=>a[0]*100+a[1]-b[0]*100-b[1])};
}

/* ----- las reglas se aprenden solas cuando hay Compras y Diario del mismo período (da igual en qué orden se cargaron) ----- */
function aprenderReglas(e){
  const hist={},nom={};let pers=0,regs=0,cruz=0;const sinPar=[];
  for(const a of Object.keys(e.bases))for(const m of Object.keys(e.bases[a])){
    const b=e.bases[a][m];if(!b.compras.length||!b.diario.length)continue;
    const reg=regDeComps(b.compras.map((o,i)=>buildComp(o,i)));reg.forEach((r,i)=>r._i=i);
    const best=cruzar(reg,b.diario.map(hidAsi));regs+=reg.length;
    if(!best||!best.pairs.length){sinPar.push(mesLabel(+a,+m));continue;}
    pers++;let tocado=false;
    for(const [r,as] of best.pairs){const cta=cuentaGasto(as);if(!cta)continue;cruz++;
      (hist[r.ruc]=hist[r.ruc]||{});hist[r.ruc][cta]=(hist[r.ruc][cta]||0)+1;nom[r.ruc]=r.rs;
      const row=b.compras[r._i];if(vacio(row.cuenta)){row.cuenta=cta;tocado=true;}
      const gl=(as.lines.find(l=>l.cta===cta)||{}).glosa;if(gl&&vacio(row.glosa)){row.glosa=gl;tocado=true;}}
    if(tocado)dirtyB.add(pk(e.ruc,a,m));
  }
  const rep=[];let mix=0,nuevos=0;
  for(const ruc of Object.keys(hist)){
    const h=hist[ruc];const ctas=Object.keys(h).sort((x,y)=>h[y]-h[x]);let r=e.reglas[ruc];
    if(!r){r=e.reglas[ruc]={nombre:nom[ruc],cuenta:ctas[0],estado:'unica',hist:h};nuevos++;}else{r.hist=h;r.nombre=nom[ruc]||r.nombre;}
    if(r.estado!=='confirmada'){r.estado=ctas.length===1?'unica':'mixta';r.cuenta=ctas[0];}
    if(r.estado==='mixta')mix++;}
  if(pers)rep.push(`Reglas: se cruzaron Compras y Diario en ${pers} período(s) (${cruz} de ${regs} comprobantes). Proveedores con regla: ${Object.keys(hist).length} (nuevos: ${nuevos}); con historial mixto: ${mix}. Los comprobantes cruzados completaron su cuenta contable y glosa.`);
  else rep.push('Reglas: todavía no hay un período con Registro de Compras y Libro Diario a la vez. Ambos quedan guardados; las reglas se aprenderán solas cuando cargues el que falta.');
  if(sinPar.length)rep.push(`Atención: en ${sinPar.join(', ')} hay Compras y Diario, pero no pude cruzar ningún comprobante (revisa que sean de la misma empresa y período).`);
  return rep;
}

/* ----- P (el período en proceso) se arma desde lo acumulado en memoria, conservando lo que ya decidiste ----- */
function abrirPeriodo(a,m){
  const e=emp();const b=baseDe(e,a,m);if(!b||!b.compras.length)return false;a=+a;m=+m;
  const old=(P&&P.anio===a&&P.mes===m)?new Map(P.comps.map(c=>[c.key,c])):new Map();
  const comps=b.compras.map((o,i)=>buildComp(o,i));const dup=llavesProcesadas(e,a,m);
  for(const c of comps){
    prepararComp(c,e,a,m,dup);const o=old.get(c.key);if(!o)continue;
    c.cuenta=o.cuenta||c.cuenta;
    if(o.ssco&&!o.sscoReinc){if(o.prevIncl!==undefined)c.incluir=o.prevIncl;c.decision=o.prevDec||c.decision;}else{c.incluir=o.incluir;c.decision=o.decision;}
    if(JSON.stringify(o.v)!==JSON.stringify(o.orig))c.v=o.v;
    c.forzado=o.forzado;c.monedaOk=o.monedaOk;c.sscoReinc=o.sscoReinc;
  }
  for(const [k,o] of old)if(o.fuenteXml&&!comps.some(c=>c.key===k)){o.id=comps.length;comps.push(o);}
  const lg=b.log.filter(x=>x.tipo==='compras');const nombres=[...new Set(lg.map(x=>x.archivo))];
  P={anio:a,mes:m,archivo:'Base acumulada · '+nombres.slice(0,3).join(', ')+(nombres.length>3?` y ${nombres.length-3} más`:''),comps,adq:e.ruc,
    fuente:[...new Set(lg.map(x=>x.fuente))].join(' + '),totalTxt:comps.reduce((s,c)=>s+c.v.total,0)};
  A.sel=new Set();aplicarSsco();aplicarXml();return true;
}
async function cargarTipo(tipo,files,modo,aSel,mSel){
  if(!emp())return toast('Primero crea o selecciona una empresa.','err');

function descartarComps(cs){
  const e=emp();const b=baseDe(e,P.anio,P.mes,true);b.descartes=b.descartes||{};
  const ks=new Set(cs.map(keyDeC));const rows=new Map();
  for(const o of b.compras){const k=keyCompra(o);if(ks.has(k))rows.set(k,o);}
  for(const c of cs){const k=keyDeC(c);b.descartes[k]={tipo:c.tipo,serie:c.serie,nro:c.nro,ruc:c.ruc,rs:c.rs,fecha:dmy(c.fecha),total:c.v.total,row:rows.get(k)||null};}

  const ids=new Set(cs.map(c=>c.id));P.comps=P.comps.filter(c=>!ids.has(c.id));
  ids.forEach(i=>A.sel.delete(i));

/* ================= Padrón global de Sujetos Sin Capacidad Operativa (SSCO) — D. Leg. 1532 ================= */
const blankSsco=()=>({items:{},fecha:null,archivo:'',n:0,log:[]});
const SSCO_DESDE=Date.UTC(2022,2,20);   // el D. Leg. 1532 alcanza a comprobantes emitidos desde el 20/03/2022
const sscoInfo=ruc=>{const x=DB.ssco&&DB.ssco.items&&DB.ssco.items[ruc];return x?{ruc,razon:x[0]||'',fpub:x[1]||''}:null;};
const csvTxt=rows=>'﻿'+rows.map(r=>r.map(x=>{x=String(x==null?'':x);return /[",\n;]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;}).join(',')).join('\r\n');

/* ----- lectura del Excel (o CSV/TXT) del padrón: detecta las columnas por su encabezado ----- */
async function leerPadronSsco(file){
  let rows;
  if(/\.xlsx$/i.test(file.name))rows=await leerXlsx(file);
  else{const t=await leerTextoSire(file);const lines=t.split(/\r?\n/).filter(l=>l.trim());const sep=[';','|','\t',','].map(s=>[s,(lines[0]||'').split(s).length]).sort((a,b)=>b[1]-a[1])[0][0];rows=lines.map(l=>l.split(sep).map(s=>s.replace(/^"|"$/g,'').trim()));}
  let hi=-1,cR=-1,cN=-1,cF=-1;
  for(let i=0;i<Math.min(rows.length,40);i++){
    const r=(rows[i]||[]).map(x=>cellStr(x));const j=r.findIndex(x=>/^(n[°º.o]*\s*(de\s*)?)?ruc\b|n[uú]mero de ruc|^ruc$/i.test(x));
    if(j>=0){hi=i;cR=j;cN=r.findIndex(x=>/raz[oó]n|denominaci|nombre/i.test(x));cF=r.findIndex(x=>/publicaci|fecha/i.test(x));break;}
  }
  if(cR<0){  // sin encabezado: la columna donde casi todo son números de 11 dígitos
    const cols=Math.max(0,...rows.slice(0,50).map(r=>(r||[]).length));let best=-1,bs=0;
    for(let c=0;c<cols;c++){const s=rows.slice(0,50).filter(r=>/^\d{11}$/.test(cellStr((r||[])[c]).replace(/\D/g,''))&&cellStr((r||[])[c]).replace(/\D/g,'').length===11).length;if(s>bs){bs=s;best=c;}}
    if(best<0)throw new Error('No encuentro una columna de RUC (11 dígitos) en el archivo. Debe tener una columna llamada "RUC".');cR=best;hi=-1;
    cN=-1;cF=-1;
  }
  const map=new Map();let rech=0;
  for(let i=hi+1;i<rows.length;i++){const r=rows[i]||[];if(r.every(x=>cellStr(x)===''))continue;
    const ruc=cellStr(r[cR]).replace(/\.0+$/,'').replace(/\D/g,'');
    if(!/^\d{11}$/.test(ruc)){rech++;continue;}
    let f='';if(cF>=0){const d=toDate(r[cF]);if(d)f=iso(d);else f=cellStr(r[cF]);}
    map.set(ruc,[cN>=0?cellStr(r[cN]):'',f]);}
  return {entries:[...map].map(([ruc,v])=>({ruc,razon:v[0],fpub:v[1]})),rechazadas:rech,cols:{ruc:cR,razon:cN,fecha:cF}};
}
function ingresarSsco(entries,modo,archivo){
  const S=DB.ssco;let nuevos=0,act=0,quitados=0;
  if(modo==='reemplazar'){const nw=new Set(entries.map(e=>e.ruc));quitados=Object.keys(S.items).filter(r=>!nw.has(r)).length;S.items={};}
  for(const e of entries){const prev=S.items[e.ruc];if(prev)act++;else nuevos++;S.items[e.ruc]=[e.razon||(prev&&prev[0])||'',e.fpub||(prev&&prev[1])||''];}
  S.fecha=new Date().toISOString();S.archivo=archivo;S.n=Object.keys(S.items).length;
  S.log=[{f:S.fecha,archivo,modo,nuevos,act,quitados,total:S.n}].concat(S.log||[]).slice(0,10);
  save();aplicarSsco();
  return {nuevos,act,quitados,total:S.n};
}

/* ----- cruce obligatorio contra el padrón: se ejecuta en cada carga y al actualizar el padrón ----- */
function aplicarSsco(){
  if(!P)return 0;let n=0;
  for(const c of P.comps){
    const info=sscoInfo(c.ruc);const aplica=!!(info&&c.fecha&&c.fecha.getTime()>=SSCO_DESDE);
    c.sscoPre=(info&&!aplica)?'Proveedor en el padrón SSCO, pero el comprobante es anterior al 20/03/2022 (no alcanzado por el D. Leg. 1532).':null;
    if(aplica){
      if(!c.ssco){c.prevIncl=c.incluir;c.prevDec=c.decision||null;}
      c.ssco=info;
      if(!c.sscoReinc){c.incluir=false;c.decision='Proveedor en el padrón de SSCO (D. Leg. 1532): sin crédito fiscal ni gasto/costo';}
      n++;
    }else if(c.ssco){
      c.ssco=null;c.sscoReinc=false;c.incluir=c.prevIncl===undefined?true:c.prevIncl;c.decision=c.prevDec||null;
    }
  }
  return n;
}
const sscoComps=()=>P?P.comps.filter(c=>c.ssco):[];
const sscoBase=c=>c.v.bi+c.v.bi2+c.v.bi3,sscoIgv=c=>c.v.igv+c.v.igv2+c.v.igv3;
function filasReporteSsco(e){
  const out=[];
  if(P)for(const c of sscoComps())out.push({orig:'Período en curso',per:mesLabel(P.anio,P.mes),tipo:c.tipo,serie:c.serie,nro:c.nro,fecha:dmy(c.fecha),ruc:c.ruc,rs:c.rs,base:sscoBase(c),igv:sscoIgv(c),total:c.v.total,fpub:c.ssco.fpub||'',estado:c.sscoReinc?'Reincorporado por el usuario':'Excluido'});
  for(const a of Object.keys(e.periodos||{}))for(const m of Object.keys(e.periodos[a])){
    if(P&&+a===P.anio&&+m===P.mes)continue;
    for(const x of (e.periodos[a][m].excluidos||[]))if(x.ssco)out.push({orig:'Historial',per:mesLabel(+a,+m),tipo:x.tipo,serie:x.serie,nro:x.nro,fecha:x.fecha,ruc:x.ruc,rs:x.rs,base:x.base,igv:x.igv,total:x.total,fpub:x.fpub||'',estado:'Excluido'});}
  return out;
}

function pendientes(){
  const e=emp(),out={decision:[],cuenta:[],glosa:new Set(),importes:[],moneda:[]};
  if(!P)return out;
  for(const c of P.comps){
    if(c.incluir===null){out.decision.push(c);continue;}
    if(!c.incluir)continue;
    if(!c.cuenta)out.cuenta.push(c);
    else if(!e.glosas[c.cuenta])out.glosa.add(c.cuenta);
    if(!c.forzado&&!validar(c).ok)out.importes.push(c);
    if(c.moneda!=='PEN'&&!c.monedaOk)out.moneda.push(c);
  }
  return out;
}

function filaDe(c,e){
  const v=c.v,n=x=>x/100,f={};const val=validar(c);

  f.bi=n(v.bi);f.igv=n(v.igv);f.bi2=n(v.bi2);f.igv2=n(v.igv2);f.bi3=n(v.bi3);f.igv3=n(v.igv3);f.ng=n(v.ng);f.isc=n(v.isc);f.otros=n(v.otros);f.total=n(v.total);
  const tc=c.moneda==='PEN'?1:(parseFloat(c.tc)||1);f.tc=tc;
  if(c.mod){if(c.mod.fecha)f.modFecha={d:iso(c.mod.fecha)};f.modTipo=c.mod.tipo;f.modSerie=c.mod.serie6;f.modNro=c.mod.nro13;}
  f.moneda=c.moneda==='PEN'?'S':'D';
  if(c.moneda!=='PEN')f.usd=Math.round(v.total/tc)/100;
  f.fvto2={d:iso(c.fv||c.fecha)};f.condicion=c.condicion||e.cfg.condicion||'CON';
  f.ctaBase=c.cuenta;f.ctaOtros=c.cuenta;f.ctaTotal=e.cfg.cuentaTotal||'4212';
  if(val.tasa!=null)f.tasa=val.tasa;
  f.glosa=(e.glosas[c.cuenta]||'').slice(0,60);
  if(c.clasif)f.clasif=c.clasif;
  if(v.icb)f.icbper=n(v.icb);
  return {key:c.key,f};
}

function cellXml(r,c,v,s){

async function rutaHoja(zip){
  let path='xl/worksheets/sheet1.xml';
  const g=async p=>{const f=zip.file(p);return f?new DOMParser().parseFromString(await f.async('string'),'application/xml'):null;};
  const wb=await g('xl/workbook.xml'),rels=await g('xl/_rels/workbook.xml.rels');
  if(wb&&rels){const sh=wb.getElementsByTagName('sheet')[0];const rid=sh&&sh.getAttribute('r:id');
    for(const r of rels.getElementsByTagName('Relationship'))if(r.getAttribute('Id')===rid){const t=r.getAttribute('Target');path=t.startsWith('/')?t.slice(1):'xl/'+t;}}
  if(!zip.file(path))throw new Error('La plantilla no tiene una hoja legible');
  return path;
}
const joinPath=(dir,t)=>{if(t.startsWith('/'))return t.slice(1);const out=[];for(const p of (dir+t).split('/')){if(p==='..')out.pop();else if(p&&p!=='.')out.push(p);}return out.join('/');};

     <td class="n">${fmt(c.v.bi)}</td><td class="n">${fmt(c.v.igv)}</td><td class="n">${fmt(c.v.ng+c.v.otros+c.v.isc+c.v.icb)}</td><td class="n">${fmt(c.v.total)}</td><td>${val.tasa!=null?val.tasa+' %':'—'}</td><td>${esc(c.cuenta||'—')}</td><td class="small">${esc(gl||'—')}</td><td>${st.join(' ')}</td><td style="white-space:nowrap"><button class="b d" title="Eliminar este comprobante" style="padding:2px 8px" onclick="A.delComp(${c.id})">🗑</button></td></tr>`;
  }
  h+=`</table></div></div>`;
  h+=vProveedores();

  /* pendientes */
  if(p.decision.length){h+=`<div class="card"><h2>1. Decidir: incluir o excluir (${p.decision.length})</h2>`;
    for(const c of p.decision)h+=`<div class="issue"><b>${c.tipo} ${esc(c.serie)}-${esc(c.nro)}</b> · ${esc(c.rs)} · S/ ${fmt(c.v.total)}<div class="small muted">${esc(c.decision)}</div>
     <div style="margin-top:6px"><button class="b p" onclick="A.decidir(${c.id},true)">Incluir</button> <button class="b" onclick="A.decidir(${c.id},false)">Excluir</button></div></div>`;
    h+=`</div>`;}
  if(p.cuenta.length){h+=`<div class="card"><h2>2. Cuenta contable por proveedor (${new Set(p.cuenta.map(c=>c.ruc)).size})</h2>`;
    const vistos=new Set();
    for(const c of p.cuenta){if(vistos.has(c.ruc))continue;vistos.add(c.ruc);const r=e.reglas[c.ruc];const n=p.cuenta.filter(x=>x.ruc===c.ruc).length;
      h+=`<div class="issue"><b>${esc(c.rs)}</b> <span class="muted">(${c.ruc})</span> · ${n} comprobante(s)`;
      const its=p.cuenta.filter(x=>x.ruc===c.ruc&&x.xml).map(x=>xmlItems(x.xml)).filter(Boolean);if(its.length)h+=`<div class="small" style="margin-top:4px"><b>Detalle según XML:</b> ${esc(its.slice(0,3).join(' | '))}</div>`;
      if(r&&r.estado==='mixta'){h+=`<div class="small" style="margin:6px 0">Historial mixto. Elige la cuenta que corresponde:</div>`+
        Object.entries(r.hist).sort((a,b)=>b[1]-a[1]).map(([cta,k])=>`<span class="chip" onclick="A.setCuenta(${c.id},'${cta}')">${cta} ×${k} · ${esc(planDesc(cta).slice(0,50))}</span>`).join('');}
      else h+=`<div class="small muted" style="margin:6px 0">Proveedor sin historial: la app no asume cuenta.</div>`;
      h+=`<div class="row" style="margin-top:6px"><div><label>${r&&r.estado==='mixta'?'u otra cuenta':'Cuenta'}</label><input id="cu_${c.id}" list="dlCuentas" style="width:130px"></div>
        <label style="display:flex;gap:5px;align-items:center;margin:0 0 8px"><input type="checkbox" id="re_${c.id}" checked> recordar para próximos meses</label>
        <button class="b p" onclick="A.setCuentaInput(${c.id})">Usar</button></div></div>`;}
    h+=`</div>`;}
  if(p.glosa.size){h+=`<div class="card"><h2>3. Glosa estandarizada por cuenta (${p.glosa.size})</h2><p class="muted small">Solo se pregunta una vez por cuenta; queda guardada para esta empresa.</p>`;
    for(const cta of p.glosa){const d=planDesc(cta);const sug=sugerirGlosa(cta);
      h+=`<div class="issue"><b>${esc(cta)}</b> <span class="muted small">${esc(d)}</span><div class="row" style="margin-top:6px"><div><label>Glosa</label><input id="gp_${cta}" style="width:340px" placeholder="${esc(sug)}"></div>
        <button class="b" onclick="A.sugGlosa('${cta}','${esc(sug.replace(/'/g,''))}')">Usar sugerencia: ${esc(sug)}</button><button class="b p" onclick="A.setGlosa('${cta}')">Guardar glosa</button></div></div>`;}
    h+=`</div>`;}
  if(p.importes.length){h+=`<div class="card"><h2>4. Validación de importes (${p.importes.length})</h2>
    <p class="muted small">Se verifica que el IGV sea exactamente el 18 % o el 10.5 % de la base, y que base + IGV + no gravado + ISC + ICBPER + otros = total.</p>
    <div class="row" style="margin-bottom:8px"><button class="b p" onclick="A.aceptarTodas()">Aceptar todas las propuestas (en lote)</button></div>`;
    for(const c of p.importes)h+=issueImportes(c);
    h+=`</div>`;}
  if(p.moneda.length){h+=`<div class="card"><h2>5. Comprobantes en moneda extranjera (${p.moneda.length})</h2>`;
    for(const c of p.moneda)h+=`<div class="issue"><b>${c.tipo} ${esc(c.serie)}-${esc(c.nro)}</b> · ${esc(c.rs)} · ${esc(c.moneda)} · TC ${esc(c.tc)}<div class="small muted">Se llenará moneda D, el tipo de cambio del SIRE y el equivalente en dólares = total / TC. Revísalo.</div><button class="b p" style="margin-top:6px" onclick="A.okMoneda(${c.id})">Revisado</button></div>`;
    h+=`</div>`;}

  h+=`<div class="card"><h2>Generar Excel</h2>`;
  if(totalPend(p))h+=`<div class="msg m-warn">Resuelve los ${totalPend(p)} pendientes para habilitar la descarga.</div>`;
  else h+=`<div class="msg m-ok">Todo validado. Control: incluidos S/ ${fmt(sumInc)} + excluidos S/ ${fmt(exc.reduce((a,c)=>a+c.v.total,0))} = S/ ${fmt(sumInc+exc.reduce((a,c)=>a+c.v.total,0))} (total del TXT: S/ ${fmt(P.totalTxt)}${sumInc+exc.reduce((a,c)=>a+c.orig.total,0)===P.totalTxt?'':' · ojo: hay ajustes en totales'}).</div>`;
  h+=`<div class="row"><button class="b p" ${totalPend(p)?'disabled':''} onclick="A.generar(true)">Descargar para revisar (con cabecera, filas 1–13)</button>
   <button class="b" ${totalPend(p)?'disabled':''} onclick="A.generar(false)">Descargar listo para subir (sin cabecera)</button></div>
   <p class="muted small">Al descargar, el mes se guarda en el historial de la empresa.</p></div>`;
  return h+datalist(e);
}
const xmlItems=x=>x.items.map(i=>i.desc).filter(Boolean).slice(0,2).join(' · ').slice(0,110);
function xmlBadges(c){const x=c.xml;let s=`<span class="badge b-ok">XML ${x.pago.tipo==='Credito'?'crédito':'contado'}</span>`;
  if(x.detr)s+=` <span class="badge b-warn" title="Detracción ${esc(x.detr.pct)} % · S/ ${fmt(x.detr.monto)}">detracción</span>`;

  if(c.xmlAl&&c.xmlAl.length)s+=` <span class="badge b-err" title="${esc(c.xmlAl.join(' | '))}">XML distinto</span>`;return s;}
function vXmlCard(e){

   <div class="row"><div><label>XML, ZIP o PDF (varios a la vez; se acumulan)</label><input type="file" id="fXml" multiple accept=".xml,.zip,.pdf"></div><button class="b p" onclick="A.cargarXml()">Procesar comprobantes</button>${XML.items.length||XML.pdfs.length?'<button class="b" onclick="A.limpiarXml()">Limpiar</button>':''}</div>`;

     <div class="kpi">A otro RUC / DNI<b style="color:${r.otro.length?'var(--err)':'inherit'}">${r.otro.length}</b></div><div class="kpi">Cruzados con el registro<b>${r.cruz}</b></div>

    for(const x of r.otro)h+=`<div class="issue"><span class="badge b-err">Comprobante emitido a otro RUC</span> <b>${esc(x.serie)}-${esc(x.nro)}</b> · ${esc(x.emisor.razon)} · S/ ${fmt(x.v.total)}<div class="small muted">${esc(x.motivo)}. No se cruza ni se agrega para evitar mezclar gastos de otra empresa.</div></div>`;
    for(const x of r.ok)if(x.ssco)h+=`<div class="issue"><span class="badge b-err">Proveedor SSCO</span> <b>${esc(x.serie)}-${esc(x.nro)}</b> · ${esc(x.emisor.razon)} (${x.emisor.ruc}) · S/ ${fmt(x.v.total)}<div class="small muted">El emisor figura en el padrón de SSCO: este comprobante no da crédito fiscal ni gasto/costo.</div></div>`;
    for(const x of r.sinReg)h+=`<div class="issue"><span class="badge b-warn">XML sin registro</span> <b>${esc(x.serie)}-${esc(x.nro)}</b> · ${esc(x.emisor.razon)} (${x.emisor.ruc}) · ${esc(x.fecha)} · S/ ${fmt(x.v.total)}
       <div class="small muted">${esc(xmlItems(x))}</div><div class="small muted">Está emitido a esta empresa pero no aparece en el registro cargado.</div><button class="b p" style="margin-top:6px" onclick="A.addXml(${XML.items.indexOf(x)})">Agregar al registro</button></div>`;
    if(P)for(const c of P.comps)if(c.xmlAl&&c.xmlAl.length)h+=`<div class="issue"><span class="badge b-err">Importes distintos al XML</span> <b>${esc(c.serie)}-${esc(c.nro)}</b> · ${esc(c.rs)}<div class="small">${c.xmlAl.map(esc).join('<br>')}</div></div>`;
    for(const p of huerf)h+=`<div class="issue"><span class="badge b-warn">PDF sin XML</span> ${esc(p.name)}<div class="small muted">No hay un XML que coincida; sin XML no se puede validar el receptor ni leer los datos.</div></div>`;
    if(XML.dups&&XML.dups.length)h+=`<div class="msg m-info" style="margin-top:8px">${XML.dups.length} comprobante(s) repetido(s) se fusionaron sin duplicar: ${esc(XML.dups.slice(0,3).join(' · '))}${XML.dups.length>3?' …':''}</div>`;
    for(const t of XML.errores)h+=`<div class="issue"><span class="badge b-err">Error</span> ${esc(t)}</div>`;
    const ok=r.ok;
    if(ok.length){h+=`<div class="scroll" style="margin-top:8px"><table><tr><th>Comprobante</th><th>Emisor</th><th>Fecha</th><th class="n">Total</th><th>Pago</th><th>Ítems</th><th>Estado</th></tr>`+
      ok.map(x=>`<tr><td>${esc(x.tipo)} ${esc(x.serie)}-${esc(x.nro)}</td><td>${esc(x.emisor.razon)}<div class="small muted">${x.emisor.ruc}</div></td><td>${esc(x.fecha)}</td><td class="n">${fmt(x.v.total)}</td>
       <td>${x.pago.tipo==='Credito'?'Crédito'+(x.pago.cuotas.length?' · '+x.pago.cuotas.length+' cuotas':''):'Contado'}${x.detr?'<div class="small muted">Detracción '+esc(x.detr.pct)+' %</div>':''}</td><td class="small">${esc(xmlItems(x))}</td>
       <td>${x.estado==='cruzado'?'<span class="badge b-ok">cruzado</span>':x.estado==='sinReg'?'<span class="badge b-warn">sin registro</span>':'<span class="badge b-gray">válido</span>'}${x.pdf?' <span class="badge b-gray">PDF</span>':''}${x.ssco?' <span class="badge b-err">SSCO</span>':''}${x.cuadra?'':' <span class="badge b-err">no cuadra</span>'}</td></tr>`).join('')+`</table></div>`;}
  }
  return h+`</div>`;

function issueImportes(c){
  const val=validar(c);const pr=proponer(c);const row=(l,a,b)=>`<tr><td>${l}</td><td class="n">${fmt(a)}</td><td class="n" ${b!=null&&b!==a?'style="font-weight:700;color:var(--pri)"':''}>${b==null?'—':fmt(b)}</td></tr>`;
  const mot=[];if(!val.tasaOk)mot.push('El IGV no es exactamente 18 % ni 10.5 % de la base'+(val.rotoTasa.length?` (${val.rotoTasa.join(', ')})`:''));
  if(!val.cuadreOk)mot.push(`No cuadra: base + IGV + otros conceptos = ${fmt(val.suma)} y el total es ${fmt(c.v.total)} (diferencia ${fmt(val.dif)})`);
  if(c.xmlAl&&c.xmlAl.length)mot.push('Comparado con el XML: '+c.xmlAl.join('; '));
  let h=`<div class="issue"><b>${c.tipo} ${esc(c.serie)}-${esc(c.nro)}</b> · ${esc(c.rs)} · ${dmy(c.fecha)}<div class="small" style="color:var(--err);margin:4px 0">${mot.join('. ')}.</div>`;
  if(c.editando){const f=(k,l)=>`<div><label>${l}</label><input id="ed_${c.id}_${k}" type="number" step="0.01" value="${(c.v[k]/100).toFixed(2)}" style="width:110px"></div>`;
    h+=`<div class="row">${f('bi','Base imponible')}${f('igv','IGV')}${f('ng','No gravado')}${f('isc','ISC')}${f('icb','ICBPER')}${f('otros','Otros trib. y cargos')}${f('total','Total')}</div>
     <div style="margin-top:6px"><button class="b p" onclick="A.guardarEd(${c.id})">Guardar importes</button> <button class="b" onclick="A.cancelarEd(${c.id})">Cancelar</button></div>`;}
  else{h+=`<table style="max-width:520px"><tr><th>Concepto</th><th class="n">Actual</th><th class="n">Propuesta</th></tr>`+
    row('Base imponible',c.v.bi,pr.v&&pr.v.bi)+row('IGV',c.v.igv,pr.v&&pr.v.igv)+row('No gravado',c.v.ng,pr.v&&pr.v.ng)+row('Otros tributos y cargos',c.v.otros,pr.v&&pr.v.otros)+row('Total',c.v.total,pr.v&&pr.v.total)+`</table>`;
    h+=`<div class="small muted" style="margin:4px 0">${(pr.notas||[]).map(esc).join(' ')}</div><div class="row">`+
      (c.xml&&validar({v:c.xml.v}).ok&&JSON.stringify(c.xml.v)!==JSON.stringify(c.v)?`<button class="b p" onclick="A.usarXml(${c.id})">Usar importes del XML</button>`:'')+
      (pr.v?`<button class="b p" onclick="A.aceptar(${c.id})">Aceptar propuesta</button>`:'')+`<button class="b" onclick="A.editar(${c.id})">Modificar manualmente</button><button class="b" onclick="A.forzar(${c.id})">Mantener sin ajustar</button>`+
      (JSON.stringify(c.v)!==JSON.stringify(c.orig)?`<button class="b" onclick="A.restaurar(${c.id})">Restaurar valores del SIRE</button>`:'')+`</div>`;}
  return h+`</div>`;
}
function vHis(){

  const as=Object.keys(e.periodos).sort((a,b)=>b-a);
  let h=`<div class="card"><h2>Historial de ${esc(e.nombre)}</h2>`;
  if(!as.length)return h+`<p class="muted">Todavía no has procesado ningún mes. Al descargar un Excel desde <b>Procesar mes</b>, queda aquí.</p></div>`;
  h+=`<div class="tree">`+as.map(a=>{const ms=Object.keys(e.periodos[a]).sort((x,y)=>y-x);const tot=ms.reduce((s,m)=>s+e.periodos[a][m].total,0);
    return `<details open><summary>Ejercicio ${a} <span class="muted small">· ${ms.length} mes(es) · S/ ${fmt(tot)}</span></summary>`+ms.map(m=>{const r=e.periodos[a][m];

       <span style="margin-left:auto"><button class="b" onclick="A.verMes(${a},${m})">Ver</button> <button class="b" onclick="A.descMes(${a},${m},true)">Excel (con cabecera)</button> <button class="b" onclick="A.descMes(${a},${m},false)">Excel (para subir)</button> <button class="b d" onclick="A.delMes(${a},${m})">Eliminar</button></span></div>`;}).join('')+`</details>`;}).join('')+`</div></div>`;
  if(A.ver&&e.periodos[A.ver[0]]&&e.periodos[A.ver[0]][A.ver[1]]){const r=e.periodos[A.ver[0]][A.ver[1]];
    h+=`<div class="card"><h2>${mesLabel(A.ver[0],A.ver[1])}</h2><div class="scroll"><table><tr><th>Fecha</th><th>Comprobante</th><th>Proveedor</th><th class="n">Base</th><th class="n">IGV</th><th class="n">Total</th><th>Tasa</th><th>Cuenta</th><th>Glosa</th></tr>`+
     r.filas.map(f=>{const c=campos(f);return `<tr><td>${c.fecha.d.split('-').reverse().join('/')}</td><td>${c.tipo} ${esc(c.serie)}-${esc(c.numero)}</td><td>${esc(c.razon)}<div class="small muted">${esc(c.ruc)}</div></td><td class="n">${c.bi.toFixed(2)}</td><td class="n">${c.igv.toFixed(2)}</td><td class="n">${c.total.toFixed(2)}</td><td>${c.tasa!=null?c.tasa+' %':'—'}</td><td>${esc(c.ctaBase)}</td><td>${esc(c.glosa)}</td></tr>`;}).join('')+`</table></div>`+
     (r.excluidos.length?`<h3>Excluidos</h3><ul class="small">`+r.excluidos.map(x=>`<li>${esc(x.key.replace(/\|/g,' '))} — ${esc(x.motivo)}</li>`).join('')+`</ul>`:'')+`</div>`;}
  return h;
}
